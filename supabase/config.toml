# Local development configuration for the Supabase CLI (`supabase start`, `supabase test db`).
# It contains no secrets. Hosted project settings are configured in the Supabase dashboard;
# see docs/SUPABASE_SETUP.md. Never put a service-role key, JWT secret, or Apple private key here.
project_id = "maroon-compass"

[api]
enabled = true
port = 54321
# Only the public schema is exposed. GraphQL is not used by the app.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# No seed data: schedules are user data and are never bundled into the database.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher. The live harness reads magic-link emails here to exercise the same PKCE
# code exchange the Google flow uses.
[local_smtp]
enabled = true
port = 54324

[storage]
# Schedule photos and OCR text never leave the device, so no storage buckets exist.
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# The app's OAuth callback. Supabase Auth only redirects to allow-listed URLs.
additional_redirect_urls = ["marooncompass://auth/callback"]
# Access tokens expire after one hour; the app refreshes them from its Keychain session.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Required so a first Google sign-in can create the account.
enable_signup = true
# LOCAL DEVELOPMENT ONLY. Anonymous sessions are labeled in the app as non-restorable and are
# compiled into Debug builds only. Keep anonymous sign-ins disabled on any hosted project that
# real schedules depend on.
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
anonymous_users = 30
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
# The app offers no email sign-in UI. The local provider is enabled only so the integration harness
# can create restorable identities that stand in for a returning Google user (same PKCE exchange,
# token, refresh, restore, and deletion code paths). Hosted projects need not enable it.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

# Google sign-in (user decision, 2026-09-26): OAuth with PKCE through a system web-authentication
# session, returning to marooncompass://auth/callback. Scopes are limited to openid, email, and
# profile. The client ID and secret come from a Google Cloud "Web application" OAuth client whose
# authorized redirect URI is <API URL>/auth/v1/callback. Supply both through the environment;
# never commit the secret. Placeholders are fine for local work that does not reach Google.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
skip_nonce_check = false

# Sign in with Apple is not used: the current Personal Team cannot provision it.
[auth.external.apple]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Account deletion. The gateway requires a valid user JWT and the function verifies it again
# with Auth before calling the admin API with the service-role key from the function environment.
[functions.delete-account]
enabled = true
verify_jwt = true
